<div id="content" ng-controller="userCtrl">
  <div id="content-header">
    <div id="breadcrumb"> <a href="/" title="Go to Home" class="tip-bottom"><i class="icon-home"></i> Home</a> <a href="javascript:void(0);" class="current">Preferences</a> </div>
    <h1>Preferences List  <a ui-sref="addNewPreference" href="/admin/add-new-preference" class="btn btn-primary pull-right" title="Add New Preference">Add New</a></h1> 
  </div>
  <div class="container-fluid">
    <hr>
   
    <center><span style="color:red" ng-if="errorMessage">{{ errorMessage }}</span>
    <span style="color:green" ng-if="successMessage">{{ successMessage }}</span>
    <div style="margin-top:10px;" class="loadersmall" ng-if="isLoading"></div></center>
    <div class="row-fluid">
    	<div class="span12">
    		<div class="widget-box">
          <div class="widget-title"> <span class="icon"><i class="icon-th"></i></span>
            <h5>Preferences</h5>
          </div>
          <div class="widget-content nopadding">
            <table class="table table-striped table-bordered" datatable="ng" dt-options="vm.dtOptions"  ng-init="getPreferencesList()">
              <thead>
                <tr>
                  <th>S.No.</th>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Module Name</th>
                  <th>Created Date (UTC)</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr class="gradeX" ng-repeat="x in records">
                  <td>{{$index + 1}}</td>
                  <td>{{x.preferenceName}}</td>
                  <td>
                    <span ng-if="x.preferenceType == 0 || x.preferenceType == null">Describe You</span>
                    <span ng-if="x.preferenceType == 1">Looking You</span>
                  </td>
                  <td>{{x.preferenceModuleType | capitalize}}</td>
                  <td>{{x.preferenceCreatedDate}}</td>
                  <td>
                    <a ng-click="deletePreference(x.preferenceID)" class="btn btn-danger" title="Delete Preference">Delete</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
		</div>
	</div>
  </div>
</div>
